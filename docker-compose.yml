

services:
  # Infrastructure
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  db:
    image: timescale/timescaledb:latest-pg12
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exchange_db}
      POSTGRES_USER: ${POSTGRES_USER:-exchange_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_secret}
    ports:
      - "5432:5432"
    volumes:
      - exchange-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # Services
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-exchange_user}:${POSTGRES_PASSWORD:-exchange_secret}@db:5432/${POSTGRES_DB:-exchange_db}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: on-failure

  matching-engine:
    build:
      context: .
      dockerfile: apps/matching-engine/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  broadcaster:
    build:
      context: .
      dockerfile: apps/broadcaster/Dockerfile
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  processor:
    build:
      context: .
      dockerfile: apps/processor/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-exchange_user}:${POSTGRES_PASSWORD:-exchange_secret}@db:5432/${POSTGRES_DB:-exchange_db}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: on-failure

  liquidity-manager:
    build:
      context: .
      dockerfile: apps/liquidity-manager/Dockerfile
    environment:
      API_URL: http://gateway:3000
      LIQUIDITY_MARKET: TATA_INR
      LIQUIDITY_USER_ID: "5"
      LIQUIDITY_CENTER_PRICE: "1005"
    depends_on:
      gateway:
        condition: service_healthy
    restart: always

  client-app:
    build:
      context: .
      dockerfile: apps/client-app/Dockerfile
    ports:
      - "80:3000"
    environment:
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      gateway:
        condition: service_healthy
      broadcaster:
        condition: service_healthy
    restart: always

volumes:
  exchange-db-data:
